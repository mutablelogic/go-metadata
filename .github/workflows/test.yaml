name: "Test"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel a run for the same branch or pull request when a new commit
# supersedes it, rather than running both
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Build with go-metadata's go.mod, rather than a workspace
  GOWORK: "off"

jobs:
  nocgo:
    name: Test without cgo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: make fmt

      - name: Vet
        run: make vet CGO_ENABLED=0

      - name: Run tests
        run: make test-nocgo

  # The version of go-media in go.mod, whose dev image, of its libraries,
  # the tests with cgo are run in, as its bindings are for its versions of
  # them
  version:
    name: Version of go-media
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gomedia.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Version of go-media
        id: gomedia
        run: echo "version=$(awk '$1 == "github.com/mutablelogic/go-media" { print $2 }' go.mod)" >> "$GITHUB_OUTPUT"

  # The tests with cgo, in go-media's dev image, which has its libraries,
  # built with FFmpeg's LGPL license, as go-metadata only decodes, in
  # /opt/go-media, with their headers, and the tools to build with them, so
  # they aren't built here
  cgo:
    name: Test with cgo
    needs: version
    runs-on: ubuntu-latest
    container: ghcr.io/mutablelogic/go-media:${{ needs.version.outputs.version }}-lgpl-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The types of files by their extensions, which content types are
      # detected with, as Ubuntu has, which the image doesn't
      - name: Install media types
        run: apt-get update -y && apt-get install -y --no-install-recommends media-types shared-mime-info

      - name: Report the libraries
        run: make deps GO_MEDIA_PREFIX=/opt/go-media

      - name: Vet
        run: make vet CGO_ENABLED=1 GO_MEDIA_PREFIX=/opt/go-media

      - name: Run tests with the race detector
        run: make test-race CGO_ENABLED=1 GO_MEDIA_PREFIX=/opt/go-media
